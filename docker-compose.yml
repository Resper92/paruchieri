services:
  db:
    image: postgres:16
    container_name: hairstylist_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: booking_db
    ports:
      - "5433:5432"
    volumes:
      - parrucchieri_data_volume:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: hairstylist_api
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hairstylist_frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  parrucchieri_data_volume:
    name: hairstylist_booking_db_storage