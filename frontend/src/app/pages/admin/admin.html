<section class="page">
  <h1>Users</h1>

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Email</th>
        <th>Role</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td>{{ user.id }}</td>
          <td>{{ user.email }}</td>
          <td>
            <select [value]="user.role" (change)="changeRole(user, $any($event.target).value)">
              @for (role of roles; track role) {
                <option [value]="role">{{ role }}</option>
              }
            </select>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="3">No users yet.</td></tr>
      }
    </tbody>
  </table>
</section>
